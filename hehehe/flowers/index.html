---
layout: default
title: "Макрокропофо... тьфу, фотки цветов крч"
---

<h1>Цветы</h1>
<p class="subheading">Фотографии на телефон Vivo X200 Ultra</p>
<p class="italic">Определения могут быть неточными</p>

<div class="flower-grid">
  {% for flower in site.data.flowers %}
    <div class="grid-item">
      <a href="#" class="lightbox-trigger" data-image="{{ flower.image }}" data-caption="{{ flower.caption }}">
        <img src="{{ flower.image }}" alt="{{ flower.caption }}" loading="lazy">
      </a>
    </div>
  {% endfor %}
</div>

<!-- Модальное окно лайтбокса -->
<div id="lightbox" class="lightbox">
  <span class="close-lightbox">&times;</span>
  <button class="lightbox-prev">‹</button>
  <img class="lightbox-image" id="lightbox-img" src="" alt="">
  <button class="lightbox-next">›</button>
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>
