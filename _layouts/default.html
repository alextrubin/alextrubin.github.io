<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% if page.title %}
      {{ page.title }} – {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
<button id="theme-toggle" class="theme-btn" aria-label="Переключить тему">
  🌙
</button>
  
  <div class="container">
    <!-- Шапка с переключателем языков (вынесена в отдельный include) -->
    {% include header.html %}

    <!-- Навигационное меню (вынесено в отдельный include) -->
    {% include nav.html %}

    <!-- Основное содержимое страницы – сюда подставляется контент -->
    <main>
      {{ content }}
    </main>

    <!-- Подвал, если нужен -->
    {% include footer.html %}
  </div>

<script src="{{ '/js/lightbox.js' | relative_url }}"></script>
  
</body>
</html>
