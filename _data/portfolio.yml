about:
  ru:
    - "Горю природой и фотографией с самого детства."
    - "Не устаю восхищаться жизнью во всех её проявлениях и замечать повсюду её красоту."
    - "Мечтаю объездить как можно больше мест, посмотреть всё многообразие природы нашей планеты"
  en:
    - "Nature and photography have been my passion since childhood."
    - "I never cease to marvel at life in all its manifestations and to notice its beauty everywhere."
    - "I dream of traveling to as many places as I can and seeing the full diversity of nature on our planet"

